name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (type-check)
        run: npm run build

      - name: Unit tests
        env:
          PUBLIC_MEDIA_SIGNING_SECRET: "ci-dummy-secret-at-least-32-chars"
        run: npm test
