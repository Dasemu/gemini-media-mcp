    # Public only when the application validates the expiring HMAC signature.
    location /zenvairogoogle/public-media/ {
        auth_basic off;

        proxy_pass http://127.0.0.1:8087/public-media/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8087;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    location /zenvairogoogle/media/ {
        auth_basic "Zenvairo Google Media MCP";
        auth_basic_user_file /etc/nginx/htpasswd/zenvairogoogle;

        proxy_pass http://127.0.0.1:8087/media/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8087;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-MCP-Server-Token "__MCP_SERVER_TOKEN__";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /zenvairogoogle/ {
        auth_basic "Zenvairo Google Media MCP";
        auth_basic_user_file /etc/nginx/htpasswd/zenvairogoogle;
        client_max_body_size 40m;

        proxy_pass http://127.0.0.1:8087/;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:8087;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
        proxy_set_header X-MCP-Server-Token "__MCP_SERVER_TOKEN__";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_set_header Mcp-Protocol-Version $http_mcp_protocol_version;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
    }
